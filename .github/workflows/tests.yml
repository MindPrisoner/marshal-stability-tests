name: marshal-stability-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect fingerprints
        run: python scripts/collect_fingerprints.py --repeats 10 > fingerprints.json
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprints-${{ matrix.os }}-py${{ matrix.python-version }}
          path: fingerprints.json
